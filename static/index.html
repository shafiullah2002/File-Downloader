<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Download Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <p class="eyebrow">DOCUMENT LIBRARY</p>
            <h1>Download Your Files</h1>
            <p class="subtitle">PDF, Word, Excel, PowerPoint and ZIP files available in one place.</p>
        </section>

        <section class="panel">
            <div class="panel-header">
                <div>
                    <h2>Available Files</h2>
                    <p id="file-count">Loading files...</p>
                </div>
                <button id="refresh-btn" class="secondary-btn">Refresh</button>
            </div>

            <div id="loading" class="state-message">Loading...</div>
            <div id="empty-state" class="state-message hidden">
                No files found. Add files inside the <strong>files</strong> folder.
            </div>
            <div id="error-state" class="state-message error hidden"></div>
            <div id="files-grid" class="files-grid"></div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
